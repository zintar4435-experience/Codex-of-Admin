# CI панели: те же проверки, что pre-flight в update.sh (компиляция всех
# .py + парс всех Jinja-шаблонов), плюс smoke-тест фабрики приложения и
# bash -n для установочных скриптов. Панель ставится на сервер прямо из
# main (bootstrap.sh) — CI ловит синтаксические ошибки ДО того, как они
# уедут на боевой сервер.
#
# Матрица Python: 3.10 = Ubuntu 22.04, 3.12 = Ubuntu 24.04 — целевые ОС
# панели (см. README).
name: CI

on:
  push:

defaults:
  run:
    working-directory: proxy-panel-v11-stage2-4-uifix-FIXED8

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: proxy-panel-v11-stage2-4-uifix-FIXED8/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python (как pre-flight update.sh)
        run: python -m compileall -q app run.py

      - name: Parse Jinja templates (как pre-flight update.sh)
        run: |
          python - <<'PY'
          import os, sys
          from jinja2 import Environment, FileSystemLoader, exceptions
          tdir = "app/templates"
          env = Environment(loader=FileSystemLoader(tdir))
          bad = []
          for root, _, files in os.walk(tdir):
              for f in files:
                  if not f.endswith(".html"):
                      continue
                  rel = os.path.relpath(os.path.join(root, f), tdir)
                  try:
                      env.parse(open(os.path.join(root, f)).read())
                  except exceptions.TemplateSyntaxError as e:
                      bad.append(f"  {rel}: {e}")
          if bad:
              print("Jinja syntax errors:\n" + "\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print("Jinja OK")
          PY

      - name: Smoke — create_app и базовые GET
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("SECRET_KEY", "ci-smoke")
          from app import create_app
          app = create_app()
          c = app.test_client()
          for path in ("/", "/auth/login"):
              r = c.get(path)
              print(path, r.status_code)
              assert r.status_code in (200, 302, 308), (path, r.status_code)
          print("Smoke OK")
          PY

      - name: Неинтерактивное создание администратора
        # Регресс-замок на полевую аварию: раньше создание админа шло через
        # input()+getpass() и ломалось при установке `curl | sudo bash`
        # (нет терминала). Проверяем, что путь через окружение работает и
        # пароль реально записан (полевой случай — password_hash был пуст).
        env:
          SECRET_KEY: ci-admin
          PP_ADMIN_USERNAME: ciadmin
          PP_ADMIN_PASSWORD: ciPassw0rd1234
        run: |
          python run.py --create-admin
          python - <<'PY'
          import os
          os.environ["SECRET_KEY"] = "ci-admin"
          from app import create_app
          from app.models import User
          app = create_app()
          with app.app_context():
              u = User.query.filter_by(username="ciadmin").first()
              assert u is not None, "админ не создан"
              assert u.password_hash, "password_hash пуст"
              assert u.check_password("ciPassw0rd1234"), "пароль не совпал"
          print("Non-interactive admin OK")
          PY

      - name: Валидация Reality до применения
        # Регресс-замок: Reality на 443 без источника serverNames (домен
        # панели не задан) должен ОТКЛОНЯТЬСЯ человеческим сообщением, а не
        # ронять панель / сыпать дампом xray (полевой отчёт 30.08, пункты 17–19).
        env:
          SECRET_KEY: ci-reality
        run: |
          python - <<'PY'
          import os
          os.environ["SECRET_KEY"] = "ci-reality"
          from app import create_app
          from app.api.inbounds import _validate_reality_ready
          app = create_app()
          keys = {"reality_public_key": "pub", "reality_private_key": "priv"}
          with app.app_context():
              # Пустая БД: ни panel_domain, ни naive → Reality на 443 нельзя.
              err = _validate_reality_ready(443, dict(keys))
              assert err and "домен панели" in err, err
              # Классический Reality без serverNames — тоже отказ.
              err2 = _validate_reality_ready(8443, dict(keys))
              assert err2 and "serverNames" in err2, err2
              # С serverNames — проходит.
              ok = _validate_reality_ready(8443, {**keys, "reality_server_names": ["www.cloudflare.com"]})
              assert ok is None, ok
              # Без ключей — отказ.
              err3 = _validate_reality_ready(8443, {"reality_server_names": ["x.com"]})
              assert err3 and "ключ" in err3.lower(), err3
          print("Reality validation OK")
          PY

      - name: Авто-откат shared-443 при мёртвом :443
        # Регресс-замок на полевую аварию: при переходе в shared-443 (Reality
        # на :443 → relay → Caddy на 8443) systemctl мог вернуть 0, но связка
        # трафик не несла — панель по домену «падала наглухо», а VLESS «за
        # настоящим сайтом» показывал «подключено» и молча ничего не грузил
        # (`xray run -test` этого не ловит — он валидирует конфиг, не живой
        # путь). Проверяем: (1) health-check :443 fail-closed на закрытом порту
        # без исключения; (2) SNI берётся из panel_domain; (3) авто-откат
        # отключает Reality-443, пишет причину и применяет xray→caddy.
        env:
          SECRET_KEY: ci-rollback
        run: |
          python - <<'PY'
          import os, json
          os.environ["SECRET_KEY"] = "ci-rollback"
          from app import create_app
          import app.api.inbounds as inb
          from app.models import db, Inbound, Setting
          app = create_app()
          with app.app_context():
              db.create_all()
              Setting.set("panel_domain", "panel.example.com")
              # (1) health-check на закрытом :443 → «dead» (без исключений).
              verdict, detail = inb._healthcheck_public_443(
                  "panel.example.com", attempts=1, timeout=1.0)
              assert verdict == "dead", ("закрытый :443 должен быть dead", verdict, detail)
              # (1b) Классификатор: откат ТОЛЬКО когда никто TLS-способный
              # не ответил. TLS-алерт (SSLError с причиной) = фронт жив,
              # сертификат ещё выпускается — НЕ откатывать (иначе тушим
              # правильный инбаунд во время прогрева ACME).
              import ssl, socket
              cls = inb._classify_443_failure
              assert cls(ConnectionRefusedError()) == "dead"
              assert cls(TimeoutError()) == "dead"
              assert cls(socket.timeout()) == "dead"
              assert cls(ConnectionResetError()) == "dead"
              assert cls(ssl.SSLEOFError()) == "dead"          # EOF без алерта
              assert cls(ssl.SSLZeroReturnError()) == "dead"
              assert cls(ssl.SSLError(1, "TLSV1_ALERT_INTERNAL_ERROR")) == "alive"
              assert cls(ssl.SSLError(1, "SSLV3_ALERT_HANDSHAKE_FAILURE")) == "alive"
              # (2) SNI: панельный домен предпочтительнее naive.
              assert inb._shared_443_healthcheck_sni() == "panel.example.com"
              # (3) авто-откат отключает Reality-443 и восстанавливает :443.
              ib = Inbound(
                  tag="reality443", engine="xray", protocol="vless", port=443,
                  domain="panel.example.com", tls_enabled=False, transport="tcp",
                  transport_config=json.dumps({
                      "reality_public_key": "pub", "reality_private_key": "priv",
                      "reality_short_ids": [""],
                  }),
                  extra_config="{}", enabled=True,
              )
              db.session.add(ib); db.session.commit()
              ib_id = ib.id
              order = []
              inb.apply_xray_config = lambda: (order.append("xray"), (True, "ok"))[1]
              inb.apply_caddy_config = lambda: (order.append("caddy"), (True, "ok"))[1]
              ok_r, msg = inb._rollback_shared_443("panel.example.com", "timeout")
              assert ok_r is False, msg
              db.session.expire_all()
              ib2 = db.session.get(Inbound, ib_id)
              assert ib2.enabled is False, "Reality-443 должен быть отключён"
              assert ib2.get_extra_config().get("auto_disabled_reason"), "нет причины авто-отключения"
              assert order == ["xray", "caddy"], ("порядок: xray освобождает :443, caddy занимает", order)
          print("Shared-443 auto-rollback OK")
          PY

      - name: Метка расположения сервера в ссылках
        # Регресс-замок режима «За границей»: панель кладёт coc_region=intl|ru
        # во все ссылки, которые понимает приложение (VLESS Reality, VLESS «за
        # сайтом», NaiveProxy). По умолчанию intl — работающие серверы после
        # обновления ведут себя как раньше; мусор в БД не переворачивает режим;
        # API принимает только ru/intl.
        env:
          SECRET_KEY: ci-region
        run: |
          python - <<'PY'
          import os, json, urllib.parse
          os.environ["SECRET_KEY"] = "ci-region"
          from app import create_app
          from app.models import db, Inbound, Client, Setting
          from app.api.clients import generate_link
          from app.api.system import _validate_setting
          from app.core import server_region
          app = create_app()

          def region_of(link):
              # URI без схемы-экзотики: naive+https → https, чтобы urlparse взял query.
              u = urllib.parse.urlparse(link.replace("naive+https://", "https://", 1))
              return urllib.parse.parse_qs(u.query).get("coc_region", [None])[0]

          with app.app_context():
              db.create_all()
              Setting.set("panel_domain", "panel.example.com"); db.session.commit()
              reality = Inbound(tag="r", engine="xray", protocol="vless", port=8443, transport="tcp",
                  transport_config=json.dumps({"reality_public_key":"pub","reality_private_key":"priv",
                                               "reality_server_names":["www.cloudflare.com"],"reality_short_ids":["ab"]}),
                  extra_config="{}", enabled=True)
              behind = Inbound(tag="w", engine="xray", protocol="vless", port=20001, transport="ws",
                  domain="site.example.com",
                  transport_config=json.dumps({"behind_caddy": True, "path": "/a7f3c1b9e2x"}),
                  extra_config="{}", enabled=True)
              naive = Inbound(tag="n", engine="naive", protocol="naive", domain="nv.example.com",
                  transport_config="{}", extra_config="{}", enabled=True)
              db.session.add_all([reality, behind, naive]); db.session.commit()
              cs = [Client(name="c1", inbound_id=ib.id, uuid="11111111-2222-3333-4444-555555555555",
                           username="u1", password="p1") for ib in (reality, behind, naive)]
              db.session.add_all(cs); db.session.commit()
              links = lambda: [generate_link(c, c.inbound) for c in cs]

              # 1. По умолчанию (настройка не задана) — intl во всех ссылках.
              for l in links():
                  assert region_of(l) == "intl", l
              # 2. Сервер в России — ru во всех ссылках, остальные параметры целы.
              Setting.set("server_region", "ru"); db.session.commit()
              ls = links()
              for l in ls:
                  assert region_of(l) == "ru", l
              assert "pbk=pub" in ls[0] and "security=reality" in ls[0], ls[0]
              assert "security=tls" in ls[1] and "path=%2Fa7f3c1b9e2x" in ls[1], ls[1]
              assert ls[2].startswith("naive+https://u1:p1@") and ls[2].endswith("#c1"), ls[2]
              # 3. Мусор в БД — трактуется как intl (не переворачивает режим у всех).
              Setting.set("server_region", "mars"); db.session.commit()
              assert server_region.current() == "intl"
              # 4. Валидация API: ru/intl принимаются, пусто → intl, мусор → отказ.
              assert _validate_setting("server_region", "ru") == (True, None, "ru")
              assert _validate_setting("server_region", " INTL ") == (True, None, "intl")
              assert _validate_setting("server_region", "") == (True, None, "intl")
              ok, err, _ = _validate_setting("server_region", "mars")
              assert ok is False and err, err
          print("Region marker OK")
          PY

      - name: Каскад — выходы по ключу, группы, метка у каждого подключения
        # Регресс-замок каскада (страница «Каскад», app/core/exits.py):
        # ключи vless/trojan/socks разбираются в выходы; конфиг с выходом и
        # группой (балансировщик + observatory) принимает НАСТОЯЩИЙ Xray той
        # же версии, что ставит install.sh; метка coc_region у подключения —
        # расположение ВЫХОДА, а выключенный выход возвращает подключение
        # «прямо с сервера» и в конфиге, и в метке одновременно.
        env:
          SECRET_KEY: ci-cascade
          # Своя база: предыдущие шаги оставляют в общей instance/panel.db
          # тестовые инбаунды (Reality без dest), которые Xray не примет.
          DATABASE_URL: sqlite:////tmp/ci-cascade.db
        run: |
          XV=$(grep -m1 '^XRAY_VERSION=' install.sh | cut -d'"' -f2)
          mkdir -p /tmp/xray-ci && cd /tmp/xray-ci
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XV}/Xray-linux-64.zip"
          unzip -qo xray.zip xray
          curl -fsSL -o geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
          curl -fsSL -o geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          cd - >/dev/null
          XRAY_LOCATION_ASSET=/tmp/xray-ci python - <<'PY'
          import os, json, urllib.parse
          os.environ["SECRET_KEY"] = "ci-cascade"
          import app.core.xray as X, app.core.geo_validator as G
          X.XRAY_BINARY = G.XRAY_BINARY = "/tmp/xray-ci/xray"
          from app import create_app
          from app.models import db, Inbound, Client, Setting, ExternalOutbound, OutboundGroup
          from app.core import exits as E, server_region
          from app.api.clients import generate_link
          app = create_app()

          def region_of(link):
              u = urllib.parse.urlparse(link)
              return urllib.parse.parse_qs(u.query).get("coc_region", [None])[0]

          with app.app_context():
              db.create_all()
              Setting.set("server_region", "ru"); db.session.commit()
              tc = json.dumps({"reality_public_key": "pub",
                               "reality_private_key": "4C6Ztn7qRYkQTmYGd0Ne4cLc-Bw2FrZbkPHF3vlx-nI",
                               "reality_server_names": ["www.cloudflare.com"],
                               "reality_dest": "www.cloudflare.com:443", "reality_short_ids": ["ab"]})
              ib = Inbound(tag="entry", engine="xray", protocol="vless", port=8443, transport="tcp",
                           transport_config=tc, extra_config="{}", enabled=True)
              db.session.add(ib); db.session.commit()
              cl = Client(name="c", inbound_id=ib.id, uuid="11111111-2222-3333-4444-555555555555",
                          email="c@x", flow="xtls-rprx-vision")
              db.session.add(cl); db.session.commit()

              pbk = "Zx9vQ3k2eB8mRkq1bB0nGvC2Qf4kVZ0t3rj2cQkQbV4"
              uid = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
              keys = [
                  f"vless://{uid}@nl.example.net:443?type=tcp&security=reality&pbk={pbk}&sid=ab&sni=www.microsoft.com&flow=xtls-rprx-vision&coc_region=intl#NL",
                  f"vless://{uid}@de.example.net:443?type=ws&security=tls&sni=de.example.net&path=%2Fa&host=de.example.net#DE",
                  f"vless://{uid}@fi.example.net:443?type=xhttp&security=reality&pbk={pbk}&sni=www.apple.com&path=%2Fx&mode=auto#FI",
                  f"vless://{uid}@gr.example.net:443?type=grpc&security=tls&sni=gr.example.net&serviceName=s&mode=multi#GR",
                  "trojan://pw@tr.example.net:443?security=tls&sni=tr.example.net#TR",
                  "socks5://dXNlcjpwYXNz@1.2.3.4:1080#S",
              ]
              exts = []
              for k in keys:
                  p = E.parse_link(k)
                  ext = ExternalOutbound(tag=E.new_tag(E.EXIT_TAG_PREFIX), name=p["name"],
                                         region=p["region"] or "intl", enabled=True,
                                         protocol=p["protocol"], address=p["address"], port=p["port"],
                                         username=p["username"], password=p["password"],
                                         config=json.dumps(p["config"]))
                  db.session.add(ext); db.session.commit(); exts.append(ext)
              assert exts[0].region == "intl" and exts[5].username == "user" and exts[5].password == "pass"

              # 1. Каждый вид выхода принимает настоящий Xray.
              for ext in exts:
                  ib.exit_tag = ext.tag; db.session.commit()
                  ok, msg = G.validate_config(X.generate_xray_config())
                  assert ok, (ext.name, msg)

              # 2. Группа: балансировщик + observatory; RU напрямую — до выхода.
              grp = OutboundGroup(tag=E.new_tag(E.GROUP_TAG_PREFIX), name="EU",
                                  members=json.dumps([e.tag for e in exts[:3]]), enabled=True)
              db.session.add(grp); db.session.commit()
              ib.exit_tag = grp.tag; ib.exit_ru_direct = True; db.session.commit()
              cfg = X.generate_xray_config()
              ok, msg = G.validate_config(cfg)
              assert ok, msg
              bal = cfg["routing"]["balancers"]
              assert bal[0]["tag"] == grp.tag and bal[0]["strategy"]["type"] == "leastPing", bal
              assert bal[0]["fallbackTag"] == exts[0].tag, bal
              assert set(cfg["observatory"]["subjectSelector"]) == {e.tag for e in exts[:3]}
              tail = cfg["routing"]["rules"][-3:]
              assert tail[0]["outboundTag"] == "direct" and "domain:ru" in tail[0]["domain"], tail
              assert tail[1]["outboundTag"] == "direct" and tail[1]["ip"] == ["geoip:ru"], tail
              assert tail[2] == {"type": "field", "inboundTag": ["entry"], "balancerTag": grp.tag}, tail

              # 3. Метка: сервер в России, выход за границей → intl.
              assert region_of(generate_link(cl, ib)) == "intl"
              # 4. Выход выключен → группа без первого; все выключены → напрямую
              #    и в конфиге, и в метке (они не могут разойтись).
              for e in exts[:3]:
                  e.enabled = False
              db.session.commit()
              cfg = X.generate_xray_config()
              assert "balancers" not in cfg["routing"] and "observatory" not in cfg, cfg["routing"]
              assert all(r.get("inboundTag") != ["entry"] for r in cfg["routing"]["rules"])
              assert region_of(generate_link(cl, ib)) == "ru"
              # 5. Без выхода — ровно как до каскада.
              ib.exit_tag = None; db.session.commit()
              assert region_of(generate_link(cl, ib)) == "ru"

              # 6. Понятные отказы на неподходящие ключи.
              for bad in ("", "vmess://x", "naive+https://u:p@h:443", "https://p/sub/x",
                          f"vless://{uid}@h:443?security=reality&sni=x",
                          f"vless://{uid}@h:443?type=h2"):
                  try:
                      E.parse_link(bad)
                  except E.LinkError:
                      continue
                  raise AssertionError(f"ключ должен быть отклонён: {bad}")
              # 7. Селектор балансировщика — по префиксу: конфликт ловится.
              assert E.prefix_conflicts(["out-1"], ["out-1", "out-10"]) == ["out-1 → out-10"]
          print("Cascade OK")
          PY

      - name: Сохранения не ждут перезапуска Xray
        # Регресс-замок отзывчивости: правила, внешние прокси, пресеты
        # безопасности и сплит-туннель раньше перезапускали Xray прямо в
        # запросе (1–3 с на клик) и молча теряли ошибку применения. Теперь:
        # битое отклоняется ДО сохранения (xray run -test), остальное —
        # сразу ответ с apply_id и применение в фоне; сплит-туннель больше
        # не дёргает Caddy (в «общем 443» это рвало соединение с панелью).
        # Использует Xray, скачанный шагом «Каскад».
        env:
          SECRET_KEY: ci-async
          DATABASE_URL: sqlite:////tmp/ci-async.db
        run: |
          XRAY_LOCATION_ASSET=/tmp/xray-ci python - <<'PY'
          import app.core.xray as X, app.core.geo_validator as G
          X.XRAY_BINARY = G.XRAY_BINARY = "/tmp/xray-ci/xray"
          import app.core.apply_runner as AR
          started = []
          AR.start_apply = lambda engine: (started.append(engine), "apply-1")[1]
          import app.core.caddy as C
          def no_caddy():
              raise AssertionError("Caddy не должен перезагружаться")
          C.apply_caddy_config = no_caddy
          X.apply_xray_config = lambda: (_ for _ in ()).throw(AssertionError("синхронный apply"))
          from app import create_app
          from app.models import db, RoutingRule, SplitTunnelList
          app = create_app(); app.config["LOGIN_DISABLED"] = True
          with app.app_context():
              db.create_all()
          c = app.test_client()
          with c.session_transaction() as s:
              s["_csrf"] = "t"
          H = {"X-CSRF-Token": "t"}
          r = c.post("/api/routing/", json={"name": "ok", "action": "direct",
                                             "match_ips": ["geoip:private"]}, headers=H)
          assert r.status_code == 201 and r.get_json()["apply_id"] == "apply-1", r.get_json()
          r = c.post("/api/routing/", json={"name": "bad", "action": "direct",
                                             "match_ips": ["999.1.1.1/33"]}, headers=H)
          assert r.status_code == 400 and "xray" in r.get_json()["error"].lower(), r.get_json()
          with app.app_context():
              assert [x.name for x in RoutingRule.query.all()] == ["ok"], "битое правило сохранилось"
          r = c.post("/api/security/presets/block-bittorrent/enable", headers=H)
          assert r.status_code == 200 and r.get_json()["apply_id"], r.get_json()
          r = c.post("/api/split-tunnel/", json={"name": "l", "list_type": "domain",
                                                 "action": "direct", "content": "domain:vk.com"}, headers=H)
          assert r.status_code == 201 and r.get_json()["apply_id"], r.get_json()
          r = c.delete("/api/split-tunnel/1", headers=H)
          assert r.status_code == 200 and r.get_json()["apply_id"], r.get_json()
          r = c.post("/api/outbounds/", json={"tag": "up", "protocol": "socks",
                                              "address": "1.2.3.4", "port": 1080}, headers=H)
          assert r.status_code == 201 and r.get_json()["apply_id"], r.get_json()
          assert started and set(started) == {"xray"}, started
          print("Async apply OK")
          PY

      - name: Заметность — правила подбора сайта для Reality (без сети)
        # Регресс-замок страницы «Заметность» (app/core/stealth.py): сверка
        # имени с сертификатом, список заблокированных в России, «соседство»,
        # поиск соседей укладывается в бюджет времени и честно говорит,
        # что проверил не всё. Сеть не нужна — TLS-проба подменяется.
        env:
          SECRET_KEY: ci-stealth
        run: |
          python - <<'PY'
          import time
          from app.core import stealth as st
          m = st._name_matches
          assert m("*.example.com", "a.example.com") and not m("*.example.com", "a.b.example.com")
          assert not m("*.example.com", "example.com") and m("www.x.org", "WWW.X.ORG.")
          assert st.is_ru_blocked("rr1---sn.googlevideo.com") and st.is_ru_blocked("x.com")
          assert not st.is_ru_blocked("www.apple.com") and not st.is_ru_blocked("max.com")
          assert st._proximity("5.6.7.8", "5.6.7.200") == "сосед по подсети"
          assert st._proximity("5.6.7.8", "5.6.9.1") == "рядом (та же /16)"
          assert st._proximity("5.6.7.8", "9.9.9.9") is None
          assert st.check_target("not a host")["ok"] is False
          assert st.scan_neighbors("10.0.0.5").get("error")
          ok, bad, _ = st._verdict("www.youtube.com", {"ok": True, "tls13": True, "h2": True,
                                   "name_ok": True, "tcp_ms": 5}, True, None)
          assert not ok and any("России" in b for b in bad), bad
          ok, bad, _ = st._verdict("a.example.org", {"ok": True, "tls13": True, "h2": False,
                                   "name_ok": True, "tcp_ms": 5}, True, None)
          assert not ok and "нет HTTP/2" in bad, bad

          def fake(ip, port=443, sni=None, timeout=4.0):
              time.sleep(0.2)
              last = int(ip.rsplit(".", 1)[1])
              if last == 77:
                  name = "site77.example.org"
                  return {"ok": True, "tls13": True, "h2": True, "names": [name],
                          "name_ok": (sni == name) if sni else None, "tcp_ms": 3}
              return {"ok": False, "tls13": False, "h2": False, "names": [], "error": "closed"}
          st.tls_probe = fake
          st.resolve_v4 = lambda h: ["93.184.216.77"] if h == "site77.example.org" else []
          r = st.scan_neighbors("93.184.216.34", budget_s=10, workers=64)
          assert r["candidates"] and r["candidates"][0]["dest"] == "site77.example.org:443", r
          assert r["scanned"] == r["total"] and not r["partial"], r
          t0 = time.monotonic()
          r = st.scan_neighbors("93.184.216.34", budget_s=3, workers=4)
          assert time.monotonic() - t0 < 6 and r["partial"] and r["scanned"] < r["total"], r
          print("Stealth OK")
          PY

